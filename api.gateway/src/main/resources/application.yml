server:
  port: 8030

spring:
  application:
    name: api-gateway

  cloud:

    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true

    gateway:
      routes:

        - id: producto
          uri: lb://ms-producto
          predicates:
            - Path=/api/productos/**
          filters:
            - StripPrefix=1

        - id: cliente
          uri: lb://ms-cliente
          predicates:
            - Path=/api/clientes/**
          filters:
            - StripPrefix=1

        - id: ventas
          uri: lb://ms-ventas
          predicates:
            - Path=/api/ventas/**
          filters:
            - StripPrefix=1